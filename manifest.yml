PLUGIN:
  name: 'Caalyx'
  source: 'https://github.com/alex-taxiera/proxyshop-plugin'
  license: 'LGPL'
  requires: '^1.13.0'
  version: '1.0.0'

borderless-ikoria.psd:
  name: 'Borderless Ikoria'
  id: '1jUzmokiR4dCV6m781PM_DLdKjEtokX2F'
  desc: 'A Borderless frame based on the Godzilla themed box toppers from Ikoria.'
  templates:
    Borderless Ikoria:
      BorderlessIkoriaTemplate:
        - normal

borderless-modern.psd:
  name: 'Borderless Modern'
  id: ''
  desc: 'A Borderless frame based on the styles updated in 2023.'
  templates:
    Borderless Modern:
      BorderlessModernTemplate:
        - normal
        - transform_front
        - transform_back
        - mdfc_front
        - mdfc_back

borderless-showcase-fca.psd:
  name: 'Borderless Showcase (FCA)'
  id: '1mUo7QxDcXUzMdhh-c9RXKN2GvZE2zuFd'
  desc: 'A Borderless frame based on the FCA Showcase frame.'
  templates:
    Borderless Showcase FCA:
      BorderlessShowcaseFCATemplate:
        - normal
        - transform_front
        - transform_back
        - mdfc_front
        - mdfc_back
