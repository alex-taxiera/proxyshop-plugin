name: Package and Upload Artifact

on:
  push:
    branches:
      - trunk

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caalyx-plugin-${{ github.run_number }}
          path: |
            *
            !.git/
            !.github/
            !.gitignore
